[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "huntsman-updater"
version = "0.0.2"
description = "Independent firmware updater for the Razer Huntsman V3 Pro Mini"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-only" }

[project.optional-dependencies]
hid = ["hidapi"]

[project.scripts]
huntsman-updater = "huntsman_updater.cli:main"
huntsman-updater-gui = "huntsman_updater.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
