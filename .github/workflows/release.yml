name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            install_hidapi: "false"
          - os: windows-latest
            suffix: windows-x86_64
            install_hidapi: "true"
          - os: macos-13
            suffix: macos-x86_64
            install_hidapi: "true"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      # hidapi is the only device backend available on Windows/macOS.
      # Linux uses the built-in hidraw/usbdevfs backends, so it is optional.
      - name: Install hidapi
        if: matrix.install_hidapi == 'true'
        shell: bash
        run: python -m pip install hidapi

      - name: Build executables
        shell: bash
        run: pyinstaller packaging/huntsman_updater.spec

      - name: Rename artifacts with platform suffix
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv huntsman-updater-gui.exe "huntsman-updater-gui-${{ matrix.suffix }}.exe"
            mv huntsman-updater.exe "huntsman-updater-${{ matrix.suffix }}.exe"
          else
            mv huntsman-updater-gui "huntsman-updater-gui-${{ matrix.suffix }}"
            mv huntsman-updater "huntsman-updater-${{ matrix.suffix }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huntsman-updater-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
